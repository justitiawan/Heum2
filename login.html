<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container-fluid">
    <div class="row g-0 min-vh-100">

        <div class="col-md-6 d-none d-md-block login-image"></div>

        <div class="col-md-6 d-flex align-items-center login-side">
            <div class="login-box w-100">
                <form id="loginForm" novalidate>
                    <h6 class="welcome mb-3">Welcome back!</h6>

                    <div class="mb-2">
                        <input type="email" class="form-control" id="email" placeholder="Email address" required>
                    </div>
                    <div class="mb-2">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">Remember password</label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-signin">SIGN IN</button>
                    </div>

                    <div class="text-center mt-2">
                        <a class="small" href="#" id="forgot">Forgot password?</a>
                        <span class="small text-muted"> | </span>
                        <a class="small" href="register.html">Register</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="login.js"></script>
</body>
</html>
